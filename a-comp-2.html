s":[{"label":"Similarity","formula":"A is like B.Similarly / Likewise , B does the same","eg":"Online learning is like in-person learning. **Likewise**, both require active participation.","kw":""},{"label":"Difference","formula":"Idea A , while / whereasidea B","eg":"In-person students interact face-to-face, **whereas** online students interact through a screen.","kw":""},{"label":"Difference","formula":"Idea A.In contrast / On the other hand , idea B","eg":"In-person classes meet on campus. **On the other hand**, online classes meet virtually.","kw":""}],"meta":{"unit":1,"unitTitle":"Comparing & Contrasting","topicTitle":"Making Comparisons","activityTitle":"Multiple Choice"}};</script>
