<script>window.PAGE_DATA = {"id":"spec-3","exercise":{"title":"Fill in the Blanks","spec":{"bank":["may","might","could","must","can’t"],"instr":"Complete each sentence with a modal that fits the clue. Sometimes two answers are possible.","items":["The noise [[must]] come from the construction site; there is no other building nearby.","This report [[can’t]] be finished today; it is too long.","The results [[may|might|could]] improve if we change the method.","She looks confident; she [[must]] have prepared well.","The system [[may|might|could]] fail if it is not updated."]}},"rules":[{"label":"Present","formula":"Subject + may / might / could / must / can’t + base verb","eg":"The noise **must come** from the construction site.","kw":""},{"label":"Past (support)","formula":"Subject + modal + have + past participle","eg":"She **must have prepared** well.","kw":""},{"label":"can’t","formula":"","eg":"Strong impossibility. High certainty (negative). This can’t be true.","kw":""},{"label":"may / might / could","formula":"","eg":"Possible. Low to medium certainty. The results might change.","kw":""},{"label":"must","formula":"","eg":"Almost certain. High certainty. The manager must be in his office.","kw":""}],"meta":{"unit":6,"unitTitle":"Evidence & Certainty","topicTitle":"Using Language for Speculation","activityTitle":"Fill in the Blanks"}};</script>
