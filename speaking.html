<div class="wrap">
  <div class="hero" style="padding-top:26px">
    <p class="eyebrow">IEP099 &middot; Impromptu speaking</p>
    <h1 style="font-size:32px">Speaking practice</h1>
    <p class="sub" style="font-size:16px">Get a topic, plan for one minute, then speak. Say it out loud &mdash; to a partner, or to yourself. Try to use the grammar from your unit.</p>
    <div class="rule"></div>
  </div>

  <div class="spk-controls">
    <label class="spk-field">Theme
      <select id="spTheme"></select>
    </label>
    <label class="spk-field">Speaking time
      <select id="spLen">
        <option value="45">45 seconds</option>
        <option value="60" selected>1 minute</option>
        <option value="90">90 seconds</option>
        <option value="120">2 minutes</option>
      </select>
    </label>
  </div>

  <div class="spk-card" id="spCard">
    <p class="spk-theme" id="spThemeLabel"></p>
    <p class="spk-prompt" id="spPrompt"></p>
    <p class="sp-tip" id="spTip"></p>
    <div class="spk-clock" id="spClock" hidden><span class="spk-phase" id="spPhase"></span><span class="spk-time" id="spTime"></span></div>
    <div class="spk-follow" id="spFollow" hidden>
      <p class="spk-follow-h">Follow-up questions &mdash; answer one or two</p>
      <ul id="spFollowList"></ul>
    </div>
    <div class="ex-actions" style="margin-top:18px">
      <button class="btn accent" id="spStart" type="button">Start planning (1 min)</button>
      <button class="btn ghost" id="spSkip" type="button" hidden>Skip to speaking</button>
      <button class="btn ghost" id="spDone" type="button" hidden>I&rsquo;m done</button>
      <button class="btn ghost" id="spNew" type="button">New topic</button>
    </div>
  </div>
